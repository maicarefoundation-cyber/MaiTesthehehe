      "kicker": "About us",
      "title": "A foundation\nbuilt on care",
      "body": "maiCare Foundation Inc. is a non-stock, non-profit organization based in the City of San Carlos, Pangasinan. It was born from a simple belief: that a little help, given with compassion, can change the course of a life.\n\nWe work with local government, schools, health workers and partner organizations so that every peso donated reaches the people who need it most.",
      "items": [
        {
          "a": "Our Mission",
          "b": "To promote the general well-being, self-reliance and quality of life of individuals, families and communities in need, without distinction as to race, religion, gender or political affiliation."
        },
        {
          "a": "Our Vision",
          "b": "Communities where every family has access to education, health care and the means to earn a decent living."
        },
        {
          "a": "Our Promise",
          "b": "No part of our income goes to any member, trustee or officer. Every donation is used solely for our programs."
        }

 if(pth){const cur=pth=='design.cursorImg',mx=e.target.id=='logo'?480:pth=='brand.favicon'?128:cur?32:/pageImg|bgImg$/.test(pth)?1600:1200;readImg(f,mx,u=>{setP(pth,u);if(cur){const im=new Image();im.onload=()=>{cfg.design.curW=im.width;cfg.design.curH=im.height;save();render();panel()};im.src=u;return}save();render();panel()},cur)}
});
$('#app').addEventListener('pointerdown',e=>{
 if(!ARR)return;
 const lb=e.target.closest('.lkb');
 if(lb){e.preventDefault();const[i,j]=lb.dataset.lk.split('.'),el=cfg.sections[i].els[j];el.lock=!el.lock;save();render();panel();return}
 const n=e.target.closest('.cvel');if(!n||n.classList.contains('lk'))return;
 e.preventDefault();
 const el=cfg.sections[n.dataset.si].els[n.dataset.ei],box=n.parentElement.getBoundingClientRect(),rz=e.target.classList.contains('rz'),sx=e.clientX,sy=e.clientY,ox=+el.x||0,oy=+el.y||0,ow=+el.w||30;
 n.setPointerCapture(e.pointerId);
 const mv=ev=>{const dx=(ev.clientX-sx)/box.width*100,dy=(ev.clientY-sy)/box.height*100;
  if(rz){el.w=Math.max(4,Math.min(100,+(ow+dx).toFixed(1)));n.style.width=el.w+'%'}
  else{el.x=+Math.max(-20,Math.min(100,ox+dx)).toFixed(1);el.y=+Math.max(-20,Math.min(100,oy+dy)).toFixed(1);n.style.left=el.x+'%';n.style.top=el.y+'%'}};
 const up=()=>{n.removeEventListener('pointermove',mv);n.removeEventListener('pointerup',up);n.removeEventListener('pointercancel',up);save();if(tab=='layers')panel()};
 n.addEventListener('pointermove',mv);n.addEventListener('pointerup',up);n.addEventListener('pointercancel',up)});
document.addEventListener('mousemove',e=>{cx=e.clientX;cy=e.clientY;const d=$('#cdot');if(!d)return;const out=!!e.target.closest('#admin'),r=$('#cring');d.style.transform=`translate(${cx}px,${cy}px)`;d.style.opacity=r.style.opacity=out?0:1;r.classList.toggle('h',!!e.target.closest('a,button,.btn,summary,label,select'))});
$('#admin').addEventListener('keydown',e=>{if(e.target.id=='vsc'&&e.key=='Tab'&&!e.shiftKey){e.preventDefault();const t=e.target;t.setRangeText('  ',t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}))}});
$('#admin').addEventListener('scroll',e=>{if(e.target.id=='vsc')vscScroll(e.target)},true);
document.addEventListener('selectionchange',()=>{const ta=document.activeElement;if(ta&&ta.id=='vsc'){const v=ta.value.slice(0,ta.selectionStart).split('\n'),el=$('#vsc-pos');if(el)el.textContent='Ln '+v.length+', Col '+(v.at(-1).length+1)}});
addEventListener('hashchange',()=>{if(EDITOR&&/admin/.test(location.hash)){if(!WANT){try{sessionStorage.setItem('adm','1')}catch(e){}location.reload()}else panel()}});
render();panel();setTimeout(()=>{const er=runJS();if(er)console.warn(er)},0);
if(/[?&]built\b/.test(location.search)){const m=document.querySelector('meta[name=built]');setTimeout(()=>alert('Site version: '+(m?m.content:'the original file, never downloaded from the editor')),300)}
</script>
